<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Local Library{% endblock %}</title>
  <style>
    body { font-family: Georgia, serif; background: #f9f7f1; color: #3e3933; margin: 0; padding: 0; }
    header { background: #5b4a37; color: white; padding: 1rem; text-align: center; }
    nav ul { list-style: none; padding: 0; background: #7a6755; display: flex; justify-content: center; margin: 0; }
    nav li { margin: 0 1rem; }
    nav a { color: white; text-decoration: none; }
    .content { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .book-cover { max-width: 120px; height: auto; border: 1px solid #ccc; margin: 0.5rem 0; }
    .error { color: red; }
    .overdue {
  color: red;
}
  </style>
</head>
<body>
  <header><h1>Local Library</h1></header>
  <nav>
    <ul>
      <li><a href="{% url 'index' %}">Главная</a></li>
      <li><a href="{% url 'books' %}">Книги</a></li>
      <li><a href="{% url 'authors' %}">Авторы</a></li>
      {% if user.is_authenticated %}
        <li><a href="{% url 'my-borrowed' %}">Мои книги</a></li>
        <li>Привет, {{ user.username }}!</li>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit" style="background:none; border:none; color:white; text-decoration:underline; cursor:pointer;">
            Выйти
          </button>
        </form>
      {% else %}
        <li><a href="{% url 'login' %}">Войти</a></li>
      {% endif %}
    </ul>
  </nav>
  <div class="content">{% block content %}{% endblock %}</div>
</body>
</html>
